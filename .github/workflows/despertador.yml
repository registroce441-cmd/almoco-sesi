name: Despertador do banco

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  acordar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar o banco
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          corpo=$(curl -fsS --retry 3 --retry-delay 20 --max-time 60 "$URL/rest/v1/cardapio?select=data&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          case "$corpo" in
            "["*) echo "banco respondeu" ;;
            *) echo "resposta inesperada"; exit 1 ;;
          esac

      - name: Renovar o agendamento
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for arquivo in despertador.yml backup-mensal.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$arquivo/enable"
          done
