<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0B2E6B" />
<title>Sem conexão — Almoço SESI</title>
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0B2E6B;color:#fff;text-align:center}
  main{max-width:340px}
  .ponto{width:14px;height:14px;border-radius:50%;background:#E30613;margin:0 auto 20px}
  h1{font-size:24px;margin:0 0 8px}
  p{margin:0 0 24px;line-height:1.5;opacity:.85}
  button{height:52px;padding:0 28px;border:0;border-radius:16px;background:#fff;color:#0B2E6B;font:700 16px system-ui,sans-serif;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="ponto" aria-hidden="true"></div>
  <h1>Você está sem internet</h1>
  <p>Esta página precisa de conexão. O cardápio da semana abre mesmo sem internet, se você já o abriu antes.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
